name: Question Bank Quality & Schema Validation

on:
  push:
    paths:
      - 'public/data/questions/**'
      - 'public/data/pyqs/**'
  pull_request:
    paths:
      - 'public/data/questions/**'
      - 'public/data/pyqs/**'
  workflow_dispatch:

jobs:
  validate-questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify Question Schema & Bilingual Formatting
        run: node -e "
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('public/data/questions/questions.json', 'utf8'));
          if (q.length < 1000) throw new Error('Questions count below 1000 threshold: ' + q.length);
          q.forEach(item => {
            if (!item.question.en || !item.question.hi) throw new Error('Missing language text in question ' + item.id);
            if (item.options.length !== 4) throw new Error('Option count != 4 in ' + item.id);
            if (!item.source) throw new Error('Missing source in ' + item.id);
          });
          console.log('✅ All ' + q.length + ' questions verified with full schema compliance.');
        "
